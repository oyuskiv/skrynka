[workspace]
resolver = "3"

members = ["gateway"]

[workspace.dependencies]
axum = "0.8.9"
envconfig = "0.11.1"
tokio = {version = "1.53.1", features = ["full"]}
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.23", features = ["env-filter", "json"]}
serde = {version="1.0.229", features = ["derive"]}
serde_json = "1.0.151"
built = {version="0.8.1", features = ["git2", "chrono"]}
