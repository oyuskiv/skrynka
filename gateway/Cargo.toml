[package]
name = "gateway"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
axum = "0.8.6"
envconfig = "0.11.0"
tokio = {version = "1.48.0", features = ["full"]}
tracing = "0.1.41"
tracing-subscriber = {version = "0.3.20", features = ["env-filter", "json"]}

[build-dependencies]
built = {version="0.8.0", features = ["git2", "chrono"]}
